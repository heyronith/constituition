# Subject registry. Do not add/drop/substitute models.
# revision is null until scripts/resolve_model_revisions.py writes the lockfile.
# Sampling comes ONLY from this file (D10–D12 / project rule 12).
subjects:
  - config_id: qwen38_27b_nothink
    hf_repo: Qwen/Qwen3.8-27B
    revision: null
    family: qwen
    axis: family_a_reasoning_off
    compute: modal_a100_80gb
    dtype: bf16
    chat_template_kwargs:
      enable_thinking: false
    # D10: identical sampling to qwen38_27b_think; only enable_thinking differs.
    # Card (thinking params): https://huggingface.co/Qwen/Qwen3.8-27B
    sampling:
      temperature: 1.0
      top_p: 0.95
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
      repetition_penalty: 1.0

  - config_id: qwen38_27b_think
    hf_repo: Qwen/Qwen3.8-27B
    revision: null
    family: qwen
    axis: reasoning_on
    compute: modal_a100_80gb
    dtype: bf16
    # reasoning_effort is a chat-template kwarg (jinja), not SamplingParams.
    # Card: https://huggingface.co/Qwen/Qwen3.8-27B
    chat_template_kwargs:
      enable_thinking: true
      reasoning_effort: medium
    # D10: same sampling as nothink; thinking toggle is the only difference.
    sampling:
      temperature: 1.0
      top_p: 0.95
      top_k: 20
      min_p: 0.0
      presence_penalty: 0.0
      repetition_penalty: 1.0

  - config_id: gemma4_31b
    hf_repo: google/gemma-4-31B-it
    revision: null
    family: gemma
    axis: family_b_large
    compute: modal_a100_80gb
    dtype: bf16
    # Thinking off: do not insert <|think|> in the system prompt; also pass enable_thinking=False.
    # Card: https://huggingface.co/google/gemma-4-31B-it and https://ai.google.dev/gemma/docs/core/model_card_4
    # D13: Phase 2 serves with max_model_len=16384; do not quantize.
    chat_template_kwargs:
      enable_thinking: false
    sampling:
      temperature: 1.0
      top_p: 0.95
      top_k: 64

  - config_id: gemma4_12b
    # Verified Hub ID uses capital B: google/gemma-4-12B-it (not google/gemma-4-12b-it).
    hf_repo: google/gemma-4-12B-it
    revision: null
    family: gemma
    axis: scale_vs_31b
    compute: modal_l40s
    dtype: bf16
    chat_template_kwargs:
      enable_thinking: false
    # D11: same sampling as gemma4_31b. https://ai.google.dev/gemma/docs/core/model_card_4
    sampling:
      temperature: 1.0
      top_p: 0.95
      top_k: 64

  - config_id: olmo3_7b_sft
    hf_repo: allenai/Olmo-3-7B-Instruct-SFT
    revision: null
    family: olmo
    axis: family_c_sft
    compute: colab_l4
    dtype: bf16
    chat_template_kwargs: {}
    # D11: identical across OLMo stages. https://huggingface.co/allenai/Olmo-3-7B-Instruct-SFT
    sampling:
      temperature: 0.6
      top_p: 0.95

  - config_id: olmo3_7b_dpo
    hf_repo: allenai/Olmo-3-7B-Instruct-DPO
    revision: null
    family: olmo
    axis: family_c_dpo
    compute: colab_l4
    dtype: bf16
    chat_template_kwargs: {}
    # D11: identical across OLMo stages. https://huggingface.co/allenai/Olmo-3-7B-Instruct-DPO
    sampling:
      temperature: 0.6
      top_p: 0.95

  - config_id: olmo3_7b_final
    hf_repo: allenai/Olmo-3-7B-Instruct
    revision: null
    family: olmo
    axis: family_c_rlvr
    compute: colab_l4
    dtype: bf16
    chat_template_kwargs: {}
